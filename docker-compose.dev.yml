services:
  wiki:
    build: .
    volumes:
      - ./data/images:/var/www/html/images
      # Extensions with customizations, others are copied on image build
      - ./extensions/PageForms:/var/www/html/extensions/PageForms
      - ./extensions/ConfirmEdit:/var/www/html/extensions/ConfirmEdit
      # Settings
      - ./conf/LocalSettings.php:/var/www/html/LocalSettings.php
      # Semantics Configuration
      - ./data/semantics:/var/www/html/semantics_config
      # Nginx configuration
      - ./conf/nginx.conf:/etc/nginx/sites-enabled/default
    ports:
      - "${WIKI_PORT}:80"
    environment:
      - WIKI_ENV=Dev
      - DB_TYPE=mysql
      - DB_SERVER=db
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - ADMIN_USER
      - ADMIN_PASS
      - FULL_URL=http://localhost:${WIKI_PORT}
      - MEDIAWIKI_SECRET
      - WIKI_CAPTCHA_KEY
      - WIKI_CAPTCHA_SITE
      - WIKI_NO_REPLY_EMAIL
      - WIKI_EMERGENCY_EMAIL
      - DISCORD_WEBHOOK
      - AWS_DOMAIN
      - AWS_BACKEND_DOMAIN
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_BUCKET_NAME
      - AWS_REGION
      - REDIS_PASSWORD
      - REDIS_HOST
    depends_on:
      db:
        condition: service_started
      s3:
        condition: service_started
      redis:
        condition: service_started
  db:
    image: mariadb:10.6.13
    restart: always
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - ./data/db:/var/lib/mysql
  s3:
    image: quay.io/minio/minio
    ports:
      - 9000:9000
      - 9001:9001 # Admin dashboard endpoint
    restart: always
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY}"
    volumes:
      - ./data/s3:/data
    command: ["server", "/data", "--console-address", ":9001"]

  redis:
    image: redis:latest
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--save", "20", "1", "--requirepass", "${REDIS_PASSWORD}"]
